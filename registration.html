<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="style.css">
      <title>Registration</title>
   </head>
   <body  class="global-bg">
      <nav>
         <div class="logo">
            <div class="logo-holder"></div>
            <img src="images/uc.png" alt="UCLOGO"
               height="80px"width = "80px">
            <P class="title">CCS Sit-in Monitoring System</P>
         </div>
         <div class="links">
            <a href="index.html">Home</a>
            <a href="">Community</a>
            <a href="">About</a>
            <a href="login.html">Login</a>
            <a href="">Register</a>
         </div>
      </nav>
      <div class="regmain">
      </div>
      <section class="register">
          <form class="register-form" id="registration-form">
            <h1 style="margin-bottom:20px;">Register Account</h1>
            <div class="form-holder">
               <div>
                  <div class="input">
                     <label for="idnumber">ID Number</label>
                     <input type="text" id="idnumber" name="idnumber" placeholder="ID Number" required>
                  </div>
                  <div class="input">
                     <label for="lastname">Last Name</label>
                     <input type="text" id="lastname" name="lastname" placeholder="Last Name" required>
                  </div>
                  <div class="input">
                     <label for="firstname">First Name</label>
                     <input type="text" id="firstname" name="firstname" placeholder="First Name" required>
                  </div>
                  <div class="input">
                     <label for="middlename">Middle Name</label>
                     <input type="text" id="middlename" name="middlename" placeholder="Middle Name">
                  </div>
                  <div class="input">
                     <label for="courselevel">Course</label>
                     <select id="courselevel" name="courselevel" required>
                        <option value="BSIT">College of Information Technology</option>
                        <option value="BSCS">College of Computer Science</option>
                        <option value="BSCE">College of Computer Engineering</option>
                        <option value="BSAS">College of Arts and Sciences</option>
                        <option value="BSCJ">College of Criminal Justice</option>
                        <option value="BSCA">College of Customs Administration</option>
                        <option value="BSHM">College of Hospitality Management</option>
                        <option value="BSCN">College of Nursing</option>
                        <option value="BSSW">College of Social Work</option>
                        <option value="BSTE">College of Teacher Education </option>>
                     </select>
                  </div>
               </div>
               <div class="course-label">
                  <div class="input">
                     <label for="course">Course Level</label>
                     <select id="course" name="course" required>
                        <option value="" disabled selected>Course Level</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>

                        
                     </select>
                  </div>
                  <div class="input">
                     <label for="email">Email</label>
                     <input type="email" id="email" name="email" placeholder="Email" required>
                  </div>
                  <div class="input">
                     <label for="address">Address</label>
                     <input type="text" id="address" name="address" placeholder="Address">
                  </div>
                  <div class="input">
                     <label for="password">Password</label>
                     <input type="password" id="password" name="password" placeholder="Password" required>
                  </div>
                  <div class="input">
                     <label for="reppassword">Repeat your password</label>
                     <input type="password" id="reppassword" placeholder="Repeat your password" required>
                  </div>
                  <div class="actions">
                     <button class="button" type="submit">Register</button>
                     <p>Already have an account? <a href="login.html">Login here</a></p>
                  </div>
               </div>
            </div>
         </form>
       </section>

       <!-- Success Modal -->
       <div id="success-modal" class="modal" style="display: none;">
           <div class="modal-content">
               <h2>Registration Successful!</h2>
               <p>Your account has been created successfully. You can now log in.</p>
               <div class="modal-buttons">
                   <button id="success-ok-btn" class="btn-confirm">OK</button>
               </div>
           </div>
       </div>

       <style>
           .modal {
               display: none;
               position: fixed;
               z-index: 1000;
               left: 0;
               top: 0;
               width: 100%;
               height: 100%;
               background-color: rgba(0, 0, 0, 0.5);
               justify-content: center;
               align-items: center;
           }
           .modal-content {
               background-color: #fff;
               padding: 30px;
               border-radius: 10px;
               text-align: center;
               box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
               max-width: 400px;
               width: 90%;
           }
           .modal-content h2 {
               margin-top: 0;
               color: #333;
           }
           .modal-content p {
               font-size: 16px;
               color: #555;
               margin-bottom: 25px;
           }
           .modal-buttons {
               display: flex;
               justify-content: center;
               gap: 15px;
           }
           .btn-confirm {
               padding: 10px 25px;
               background-color: #28a745;
               color: white;
               border: none;
               border-radius: 5px;
               cursor: pointer;
               font-size: 16px;
               transition: background-color 0.3s;
           }
           .btn-confirm:hover {
               background-color: #218838;
           }
       </style>

       <script>
           const form = document.getElementById('registration-form');
           form.addEventListener('submit', async function(e) {
               e.preventDefault();
               
               const password = document.getElementById('password').value;
               const reppassword = document.getElementById('reppassword').value;
               
               if (password !== reppassword) {
                   alert('Passwords do not match!');
                   return;
               }
               
               const formData = {
                   idnumber: document.getElementById('idnumber').value,
                   lastname: document.getElementById('lastname').value,
                   firstname: document.getElementById('firstname').value,
                   middlename: document.getElementById('middlename').value,
                   courselevel: document.getElementById('courselevel').value,
                   course: document.getElementById('course').value,
                   address: document.getElementById('address').value,
                   email: document.getElementById('email').value,
                   password: password
               };
               
               try {
                   const response = await fetch('/register', {
                       method: 'POST',
                       headers: {
                           'Content-Type': 'application/json'
                       },
                       body: JSON.stringify(formData)
                   });
                   
                   if (response.ok) {
                       document.getElementById('success-modal').style.display = 'flex';
                   } else {
                       const errorData = await response.json();
                       alert('Registration failed: ' + (errorData.error || 'Unknown error'));
                   }
               } catch (error) {
                   console.error('Error:', error);
                   alert('An error occurred during registration.');
               }
           });
           
           document.getElementById('success-ok-btn').addEventListener('click', function() {
               window.location.href = '/login.html';
           });
           
           window.addEventListener('click', function(e) {
               const modal = document.getElementById('success-modal');
               if (e.target === modal) {
                   modal.style.display = 'none';
               }
           });
       </script>
        <script src="script.js"></script>
</body>
</html>
