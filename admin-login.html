<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Admin Login - CCS Sit-in Monitoring</title>
</head>
<body  class="global-bg">
     <nav>
        <div class="logo">
            <div class="logo-holder"></div>
            <img src="images/uc.png" alt="UCLOGO"
            height="80px"width = "80px">       
            <P class="title">CCS Sit-in Monitoring System</P>
        </div>
                

        <div class="links">
            <a href="index.html">Home</a>
            <a href="">Community</a>
            <a href="">About</a>
            <a href="login.html">Login</a>
            <a href="registration.html">Register</a>
            
        </div>
    </nav>
<section class="login">
    <form class="login-form" action="/login" method="POST">
        <h1>Admin Login</h1>

        <div class="input">
            <label for="idnumber">Username</label>
            <input type="text" id="idnumber" name="idnumber" placeholder="Admin Username" required>
        </div>
        <div class="input">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required>
        </div>
        <div class="actions">
            <button class="button" type="submit">Login as Admin</button>
            <p><a href="login.html">Student Login</a></p>
        </div>
    </form>
</section>

<!-- Login Success Modal -->
<div id="login-success-modal" class="modal">
    <div class="modal-content">
        <h2>Welcome Admin!</h2>
        <p>You have successfully logged in as Administrator.</p>
        <div class="modal-buttons">
            <button id="proceed-btn" class="btn-confirm">Proceed to Admin Dashboard</button>
        </div>
    </div>
</div>

<script>
    document.querySelector('.login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const idnumber = document.getElementById('idnumber').value;
        const password = document.getElementById('password').value;
        
        try {
            const formData = new URLSearchParams();
            formData.append('idnumber', idnumber);
            formData.append('password', password);
            
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            });
            
            if (response.redirected) {
                // Show success modal before redirecting
                document.getElementById('login-success-modal').style.display = 'flex';
                document.getElementById('proceed-btn').addEventListener('click', function() {
                    window.location.href = response.url;
                });
                
                // Auto-redirect after 2 seconds if user doesn't click
                setTimeout(() => {
                    window.location.href = response.url;
                }, 2000);
            } else {
                const errorText = await response.text();
                alert('Login failed: ' + errorText);
            }
        } catch (error) {
            console.error('Login error:', error);
            alert('Login failed. Please try again.');
        }
    });
</script>

    <script src="script.js"></script>
</body>
</html>
